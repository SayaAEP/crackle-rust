name: Stable release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/rust-next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crackle-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: rustfmt, clippy
      - name: Install ARM64 linker
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Validate source and commit messages
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Calculate version and release notes
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          header_pattern = re.compile(
              r"^(?P<type>[a-z][a-z0-9-]*)(?:\([^)]+\))?(?P<breaking>!)?: .+$"
          )
          version_pattern = re.compile(
              r"^v?(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)$"
          )

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          try:
              tags = git("tag", "--list", "v*").splitlines()
              stable_tags = []
              for tag in tags:
                  match = version_pattern.fullmatch(tag)
                  if match:
                      stable_tags.append(
                          (
                              tuple(
                                  int(match.group(name))
                                  for name in ("major", "minor", "patch")
                              ),
                              tag,
                          )
                      )
              revision_range = f"{max(stable_tags)[1]}..HEAD" if stable_tags else "HEAD"
              hashes = git(
                  "log", "--no-merges", "--format=%H", "-z", revision_range
              ).split("\0")
              commits = []
              for commit in filter(None, hashes):
                  message = git("show", "-s", "--format=%B", commit)
                  lines = message.splitlines()
                  subject = lines[0] if lines else ""
                  match = header_pattern.fullmatch(subject)
                  if not match:
                      raise ValueError(
                          f"{commit[:12]}: not a Conventional Commit: "
                          f"{subject or '<empty message>'}"
                      )
                  breaking = bool(match.group("breaking")) or any(
                      line.startswith(("BREAKING CHANGE:", "BREAKING-CHANGE:"))
                      for line in lines[1:]
                  )
                  commits.append((commit, match.group("type"), subject, breaking))

              if not commits:
                  raise ValueError("no commits found since the previous stable release")

              bump = os.environ["BUMP"]
              if bump == "auto":
                  if any(breaking for _, _, _, breaking in commits):
                      bump = "major"
                  elif any(kind == "feat" for _, kind, _, _ in commits):
                      bump = "minor"
                  else:
                      bump = "patch"

              manifest = pathlib.Path("Cargo.toml")
              cargo_text = manifest.read_text(encoding="utf-8")
              current_match = re.search(r'(?m)^version = "([^"]+)"$', cargo_text)
              if not current_match:
                  raise ValueError("could not find package version in Cargo.toml")
              current = version_pattern.fullmatch(current_match.group(1))
              if not current:
                  raise ValueError("Cargo version must be SemVer X.Y.Z")
              major, minor, patch = (
                  int(current.group(name)) for name in ("major", "minor", "patch")
              )
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  major, minor, patch = major, minor + 1, 0
              elif bump == "patch":
                  major, minor, patch = major, minor, patch + 1
              else:
                  raise ValueError(f"unsupported bump level: {bump}")
              version = f"{major}.{minor}.{patch}"

              groups = {"Features": [], "Fixes": [], "Other changes": []}
              for commit, kind, subject, breaking in commits:
                  group = {
                      "feat": "Features",
                      "fix": "Fixes",
                  }.get(kind, "Other changes")
                  suffix = " (breaking)" if breaking else ""
                  summary = subject[subject.index(":") + 2 :]
                  groups[group].append(f"- {summary}{suffix} ({commit[:7]})")

              notes = [f"# v{version}", ""]
              for title, entries in groups.items():
                  if entries:
                      notes.extend((f"## {title}", "", *entries, ""))
              pathlib.Path("release-notes.md").write_text(
                  "\n".join(notes).rstrip() + "\n", encoding="utf-8"
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"version={version}\ntag=v{version}\n")
          except (OSError, subprocess.CalledProcessError, ValueError) as error:
              print(error, file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Update manifests and changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          manifest = pathlib.Path("Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update Cargo.toml package version")
          manifest.write_text(updated, encoding="utf-8")

          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          changelog = pathlib.Path("CHANGELOG.md")
          previous = changelog.read_text(encoding="utf-8") if changelog.exists() else "# Changelog\n"
          changelog.write_text(f"{previous.rstrip()}\n\n{notes}", encoding="utf-8")
          PY
          cargo check
          cargo test --locked
      - name: Create release commit and tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
      - name: Build ARM64 release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CRACKLE_VERSION=$VERSION \
          CRACKLE_CHANNEL=stable \
          CRACKLE_COMMIT=$commit \
          CRACKLE_BUILT=$built \
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/crackle crackle-aarch64-unknown-linux-gnu
          sha256sum crackle-aarch64-unknown-linux-gnu > SHA256SUMS
          printf 'channel=stable\nversion=%s\ntag=%s\ncommit=%s\nbuilt=%s\n' \
            "$VERSION" "$TAG" "$commit" "$built" > version.txt
      - name: Push release commit and tag atomically
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/rust-next "refs/tags/$TAG"
      - name: Publish ARM64 release
        uses: softprops/action-gh-release@v2
        with:
          name: Crackle ${{ steps.release.outputs.tag }}
          tag_name: ${{ steps.release.outputs.tag }}
          overwrite_files: true
          make_latest: true
          body_path: release-notes.md
          files: |
            crackle-aarch64-unknown-linux-gnu
            SHA256SUMS
            version.txt
