name: Rust

# `rust` is the repository's default branch, so the scheduled nightly below runs
# from this workflow. Push-triggered nightlies on `rust` work as well.
on:
  push:
    branches: [rust]
    tags: ["v*", "0.*"]
  pull_request:
    branches: [rust]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bash -n lib/upgradefunc

  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install ARM64 linker
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build ARM64 release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/crackle crackle-aarch64-unknown-linux-gnu
          sha256sum crackle-aarch64-unknown-linux-gnu > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: crackle-aarch64-unknown-linux-gnu
          path: |
            crackle-aarch64-unknown-linux-gnu
            SHA256SUMS

  stable-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [test, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crackle-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the tagged commit is on the rust branch
        run: |
          git fetch origin +refs/heads/rust:refs/remotes/origin/rust
          commit=$(git rev-list -n 1 "$GITHUB_REF")
          git merge-base --is-ancestor "$commit" origin/rust
      - uses: actions/download-artifact@v4
        with:
          name: crackle-aarch64-unknown-linux-gnu
          path: release-artifacts
          if-no-files-found: error
      - name: Publish ARM64 release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            release-artifacts/crackle-aarch64-unknown-linux-gnu
            release-artifacts/SHA256SUMS

  nightly-release:
    if: >-
      github.ref == 'refs/heads/rust' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [test, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crackle-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: crackle-aarch64-unknown-linux-gnu
          path: release-artifacts
          if-no-files-found: error
      - name: Check that this build is still current
        id: freshness
        run: |
          current_sha=$(git ls-remote origin refs/heads/rust | awk '{ print $1 }')
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Move nightly tag to this build
        if: steps.freshness.outputs.current == 'true'
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
      - name: Publish ARM64 nightly
        if: steps.freshness.outputs.current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Crackle nightly
          tag_name: nightly
          target_commitish: rust
          overwrite_files: true
          prerelease: true
          make_latest: false
          body: "Mutable ARM64 Ubuntu Touch nightly. Rebuilt on pushes to the rust branch."
          files: |
            release-artifacts/crackle-aarch64-unknown-linux-gnu
            release-artifacts/SHA256SUMS
            lib/upgradefunc
