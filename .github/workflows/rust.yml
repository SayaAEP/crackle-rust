name: Rust

# Nightlies are built from the active `rust-next` branch.
on:
  push:
    branches: [rust-next]
  pull_request:
    branches: [rust-next]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: bash -n lib/upgradefunc
      - name: Validate Conventional Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python3 scripts/release.py validate --base-ref "$BASE_REF"

  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install ARM64 linker
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: Build ARM64 release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          commit=$(git rev-parse HEAD)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          package_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          case "$GITHUB_REF" in
            refs/heads/rust-next)
              channel=nightly
              version="nightly-${commit:0:7}"
              tag=nightly
              ;;
            *)
              channel=dev
              version=$package_version
              tag=dev
              ;;
          esac
          CRACKLE_VERSION=$version \
          CRACKLE_CHANNEL=$channel \
          CRACKLE_COMMIT=$commit \
          CRACKLE_BUILT=$built \
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/crackle crackle-aarch64-unknown-linux-gnu
          sha256sum crackle-aarch64-unknown-linux-gnu > SHA256SUMS
          printf 'channel=%s\nversion=%s\ntag=%s\ncommit=%s\nbuilt=%s\n' \
            "$channel" "$version" "$tag" "$commit" "$built" > version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crackle-aarch64-unknown-linux-gnu
          path: |
            crackle-aarch64-unknown-linux-gnu
            SHA256SUMS
            version.txt

  nightly-release:
    if: >-
      github.ref == 'refs/heads/rust-next' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [test, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: crackle-nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: crackle-aarch64-unknown-linux-gnu
          path: release-artifacts
          if-no-files-found: error
      - name: Check that this build is still current
        id: freshness
        run: |
          current_sha=$(git ls-remote origin refs/heads/rust-next | awk '{ print $1 }')
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Move nightly tag to this build
        if: steps.freshness.outputs.current == 'true'
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
      - name: Publish ARM64 nightly
        if: steps.freshness.outputs.current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Crackle nightly
          tag_name: nightly
          target_commitish: rust-next
          overwrite_files: true
          prerelease: true
          make_latest: false
          body: "Mutable ARM64 Ubuntu Touch nightly. Rebuilt on pushes to the rust-next branch."
          files: |
            release-artifacts/crackle-aarch64-unknown-linux-gnu
            release-artifacts/SHA256SUMS
            release-artifacts/version.txt
            lib/upgradefunc
